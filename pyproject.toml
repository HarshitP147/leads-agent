[project]
name = "leads-agent"
version = "0.1.0"
description = "Autonomous Lead Enrichment Agent (take-home for SoftwareBrio)"
requires-python = ">=3.11"
dependencies = [
    "langgraph==1.2.11",
    "langchain-core==1.6.3",
    "langchain-anthropic==1.3.0",
    "langchain-openai==1.1.14",
    "langchain-deepseek==1.1.0",
    "browser-use==0.13.10",
    "playwright==1.63.0",
    "trafilatura==2.2.0",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "httpx==0.28.1",
    "tiktoken==0.14.0",
    "tavily-python==0.8.3",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "tenacity==9.1.4",
    "python-dotenv==1.2.2",
    "typer==0.27.2",
    "rich==14.3.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Distribution name ("leads-agent") is deliberately different from the import package
# name ("enrich") — see docs/references/stack.md Gotchas: PyPI already has an unrelated
# real package literally named "enrich" (pycontribs/enrich), and a prior accidental
# `pip install enrich` collided with our own top-level `enrich/` package in site-packages.
packages = ["enrich"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
